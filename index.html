<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#06070d" />
    <title>GOLD RUSH ── 3D メダルプッシャー</title>
    <!-- HUD webfonts: without these the UI renders in whatever the OS ships
         (Segoe UI on Windows, Hiragino on macOS) and the game looks different
         on every machine. Chakra Petch = numerals/latin, Noto Sans JP = 和文. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
      <div id="loading-screen">
        <div class="loading-logo">GOLD&nbsp;RUSH</div>
        <div class="loading-bar"><span id="loading-bar-fill"></span></div>
        <div id="loading-text">読み込み中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
